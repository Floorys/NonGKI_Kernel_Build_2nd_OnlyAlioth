name: Build and Release Kernel (EN)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: "Build Kernel?"
        required: true
        type: boolean
        default: true

      release-kernel:
        description: "Publish to Releases?"
        required: true
        type: boolean
        default: true

      kernel_target:
        description: "Kernel Source to Build"
        required: true
        type: choice
        default: "both"
        options:
          - "both"
          - "e404"
          - "lineageos"

      kernel_branch:
        description: "LineageOS Kernel Branch (sm8250)"
        required: true
        type: choice
        default: "lineage-24.0"
        options:
          - "lineage-24.0"
          - "lineage-23.2"
          - "lineage-22.2"
          - "lineage-21"

      e404_branch:
        description: "E404 Kernel Branch (sm8250)"
        required: true
        type: choice
        default: "main"
        options:
          - "main"
          - "main-bpf"
          - "a17"
          - "staging"
          - "personal"
          - "personal-test"

      kernelsu_fork:
        description: "KernelSU Fork / Manager (only bakasu works with SUSFS)"
        required: true
        type: choice
        default: "bakasu"
        options:
          - "bakasu"
          - "next"
          - "xxksu"
          - "rsuntk"
          - "sukisu"

      multi_manager:
        description: "Multi-Manager (BakaSU only: BakaSU + Official KSU + KowSU)"
        required: true
        type: boolean
        default: true

      susfs_enable:
        description: "Enable SUSFS (root/module hiding; requires bakasu)"
        required: true
        type: boolean
        default: true

      nomount_enable:
        description: "Enable NoMount (mountless path redirection)"
        required: true
        type: boolean
        default: true

      bbg_enable:
        description: "Enable Baseband Guard (BBG partition protection)"
        required: true
        type: boolean
        default: false

      bbg_boot:
        description: "BBG: Block writes to boot partition (requires BBG)"
        required: true
        type: boolean
        default: false

      rekernel_enable:
        description: "Enable Re:Kernel (for aggressive process freezer)"
        required: true
        type: boolean
        default: false

      droidspaces_enable:
        description: "Enable Droidspaces (LXC / Docker support)"
        required: true
        type: boolean
        default: false

      disable_lto_cfi:
        description: "Disable LTO / CFI (faster build, troubleshooting)"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '0 3 * * 3'

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true)
    with:
      kernel_target: ${{ inputs.kernel_target || 'both' }}
      kernel_branch: ${{ inputs.kernel_branch || 'lineage-24.0' }}
      e404_branch: ${{ inputs.e404_branch || 'main' }}
      kernelsu_fork: ${{ inputs.kernelsu_fork || 'bakasu' }}
      multi_manager: ${{ inputs.multi_manager != false }}
      susfs_enable: ${{ inputs.susfs_enable != false }}
      nomount_enable: ${{ inputs.nomount_enable != false }}
      bbg_enable: ${{ inputs.bbg_enable == true }}
      bbg_boot: ${{ inputs.bbg_boot == true }}
      rekernel_enable: ${{ inputs.rekernel_enable == true }}
      droidspaces_enable: ${{ inputs.droidspaces_enable == true }}
      disable_lto_cfi: ${{ inputs.disable_lto_cfi == true }}

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-24.04
    needs:
      - build-kernel
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release-kernel == true)
    env:
      REPO_OWNER: Floorys
      REPO_NAME: NonGKI_Kernel_Build_2nd
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Pre-built"
      KERNEL_TARGET: "${{ inputs.kernel_target || 'both' }}"
      K_BRANCH: "${{ inputs.kernel_branch || 'lineage-24.0' }}"
      E404_BRANCH: "${{ inputs.e404_branch || 'main' }}"
      KSU_FORK: "${{ inputs.kernelsu_fork || 'bakasu' }}"
      MULTI_MANAGER: "${{ format('{0}', inputs.multi_manager != false) }}"
      SUSFS_ENABLE: "${{ format('{0}', inputs.susfs_enable != false) }}"
      NOMOUNT_ENABLE: "${{ format('{0}', inputs.nomount_enable != false) }}"
      BBG_ENABLE: "${{ format('{0}', inputs.bbg_enable == true) }}"
      REKERNEL_ENABLE: "${{ format('{0}', inputs.rekernel_enable == true) }}"
      DROIDSPACES_ENABLE: "${{ format('{0}', inputs.droidspaces_enable == true) }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate and Create New Tag
        run: |
          NEW_TAG=$(date +%s)
          echo "New tag: $NEW_TAG"

          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          mark() { [ "$1" = "true" ] && echo "✅" || echo "❌"; }

          KSU_INFO=""
          case "${KSU_FORK}" in
            xxksu)
              git clone -b master https://github.com/backslashxx/KernelSU.git KernelSU-tmp
              VER=$(cd KernelSU-tmp && expr $(/usr/bin/git rev-list --count HEAD) + 30000 - 82)
              KSU_INFO="[KernelSU-xxKSU](https://github.com/backslashxx/KernelSU) Version: $VER"
              ;;
            rsuntk)
              git clone -b main https://github.com/rsuntk/KernelSU.git KernelSU-tmp
              VER=$(cd KernelSU-tmp && expr $(/usr/bin/git rev-list --count HEAD) + 29971)
              KSU_INFO="[KernelSU-rsuntk](https://github.com/rsuntk/KernelSU) Version: $VER"
              ;;
            sukisu)
              git clone -b builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU-tmp
              VER=$(cd KernelSU-tmp && expr $(/usr/bin/git rev-list --count HEAD) + 40000 - 2815)
              KSU_INFO="[KernelSU-SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra) Version: $VER"
              ;;
            next)
              git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-tmp
              VER=$(cd KernelSU-tmp && expr $(/usr/bin/git rev-list --count HEAD) + 30000)
              KSU_INFO="[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next) Version: $VER"
              ;;
            *)
              git clone -b main https://github.com/Baka-SU/BakaSU.git KernelSU-tmp
              VER=$(cd KernelSU-tmp && expr $(/usr/bin/git rev-list --count HEAD) + 30000 + 700)
              KSU_INFO="[BakaSU](https://github.com/Baka-SU/BakaSU) Version: $VER (Multi-Manager: $(mark "${MULTI_MANAGER}"))"
              ;;
          esac

          {
            echo "RELEASE_NOTES<<EOF"
            echo "Build configuration for **Xiaomi Poco F3 (\`alioth\`)**:"
            echo ""
            echo "| Kernel / Source | Codename | Kernel Ver | Branch | Method | KernelSU | SUSFS | NoMount | Re:Kernel | BBG | Droidspaces |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            if [[ "${KERNEL_TARGET}" == "lineageos" || "${KERNEL_TARGET}" == "both" ]]; then
              echo "| Xiaomi Poco F3 (LineageOS) | alioth | 4.19 | ${K_BRANCH} | AnyKernel3 | ${KSU_FORK} | $(mark "${SUSFS_ENABLE}") | $(mark "${NOMOUNT_ENABLE}") | $(mark "${REKERNEL_ENABLE}") | $(mark "${BBG_ENABLE}") | $(mark "${DROIDSPACES_ENABLE}") |"
            fi
            if [[ "${KERNEL_TARGET}" == "e404" || "${KERNEL_TARGET}" == "both" ]]; then
              echo "| Xiaomi Poco F3 (E404) | alioth | 4.19 | ${E404_BRANCH} | AnyKernel3 | ${KSU_FORK} | $(mark "${SUSFS_ENABLE}") | $(mark "${NOMOUNT_ENABLE}") | $(mark "${REKERNEL_ENABLE}") | $(mark "${BBG_ENABLE}") | $(mark "${DROIDSPACES_ENABLE}") |"
            fi
            echo ""
            echo "$KSU_INFO"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/*; do
              if [ -d "$file" ]; then
                  continue
              fi
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/*
