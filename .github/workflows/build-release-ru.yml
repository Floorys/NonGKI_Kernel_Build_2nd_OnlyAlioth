name: Сборка и релиз ядра (RU)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release-kernel:
        description: "Выложить в Releases?"
        required: true
        type: boolean
        default: true

      kernel_target:
        description: "Какое ядро собирать?"
        required: true
        type: choice
        default: "both"
        options:
          - "both"
          - "lineageos"
          - "e404"

      kernel_branch:
        description: "Ветка ядра LineageOS (sm8250)"
        required: true
        type: choice
        default: "lineage-24.0"
        options:
          - "lineage-24.0"
          - "lineage-23.2"
          - "lineage-22.2"
          - "lineage-21"

      e404_branch:
        description: "Ветка ядра E404 (sm8250)"
        required: true
        type: choice
        default: "main"
        options:
          - "main"
          - "main-bpf"
          - "a17"
          - "staging"
          - "personal"
          - "personal-test"

      kernelsu_fork:
        description: "KernelSU / менеджер (SUSFS совместим только с bakasu; не совместим с: next, xxksu, rsuntk, sukisu)"
        required: true
        type: choice
        default: "bakasu"
        options:
          - "bakasu"
          - "next"
          - "xxksu"
          - "rsuntk"
          - "sukisu"

      multi_manager:
        description: "Multi-Manager (для BakaSU: BakaSU + Official KSU + KowSU)"
        required: true
        type: boolean
        default: true

      susfs_enable:
        description: "Включить SUSFS (не совместим с: next, xxksu, rsuntk, sukisu — работает ТОЛЬКО с bakasu)"
        required: true
        type: boolean
        default: true

      nomount_enable:
        description: "Включить NoMount (подмена путей без монтирования)"
        required: true
        type: boolean
        default: true

      bbg_enable:
        description: "Включить Baseband Guard (BBG — защита разделов)"
        required: true
        type: boolean
        default: false

      bbg_boot:
        description: "BBG: блокировать запись в boot раздел (нужен BBG)"
        required: true
        type: boolean
        default: false

      rekernel_enable:
        description: "Включить Re:Kernel (для агрессивной заморозки процессов)"
        required: true
        type: boolean
        default: false

      droidspaces_enable:
        description: "Включить Droidspaces (LXC / Docker)"
        required: true
        type: boolean
        default: false

      kpm_enable:
        description: "Включить KPM (поддержка Kernel Patch Module)"
        required: true
        type: boolean
        default: false

      disable_lto_cfi:
        description: "Отключить LTO / CFI (быстрее сборка, для отладки)"
        required: true
        type: boolean
        default: false

jobs:
  run-build:
    name: "Сборка и релиз Poco F3"
    uses: ./.github/workflows/build-release.yml
    secrets: inherit
    with:
      release-kernel: ${{ inputs.release-kernel }}
      kernel_target: ${{ inputs.kernel_target }}
      kernel_branch: ${{ inputs.kernel_branch }}
      e404_branch: ${{ inputs.e404_branch }}
      kernelsu_fork: ${{ inputs.kernelsu_fork }}
      multi_manager: ${{ inputs.multi_manager }}
      susfs_enable: ${{ inputs.susfs_enable }}
      nomount_enable: ${{ inputs.nomount_enable }}
      bbg_enable: ${{ inputs.bbg_enable }}
      bbg_boot: ${{ inputs.bbg_boot }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      disable_lto_cfi: ${{ inputs.disable_lto_cfi }}
      lang: "ru"
